<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários GET e POST</title>
</head>
<body>
  <h1>Formulário com GET</h1>

  <form action="#" method="get">
    <label for="nome-get">Nome:</label>
    <input type="text" id="nome-get" name="nome" required>

    <label for="email-get">E-mail:</label>
    <input type="email" id="email-get" name="email" required>

    <button type="submit">Enviar com GET</button>
  </form>

  <h1>Formulário com POST</h1>

  <form action="#" method="post">
    <label for="nome-post">Nome:</label>
    <input type="text" id="nome-post" name="nome" required>

    <label for="email-post">E-mail:</label>
    <input type="email" id="email-post" name="email" required>

    <button type="submit">Enviar com POST</button>
  </form>
</body>
</html>
